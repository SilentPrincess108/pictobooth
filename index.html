<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictobooth</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>°˖✧ PICTOBOOTH ✧˖°</h1>
        <h3>A very bare bones and basic photobooth site! Strike a pose and take a picture!! </h3>
        <h6>(more photobooth essentials to come!!)</h6>
    </header>
    <div class="container">
        <div id="leftside">
            <video class="frame" id="webcam-video" autoplay></video>
            <button onclick="snap()">Take Picture</button>
        </div>
        <div id="rightside">
            <canvas class="frame" id="picture"></canvas>
            <button id="download" onclick="download()">Download pic</button>
        </div>
    </div>
    <footer>Rosan Syal - 2026</footer>
</body>
</html>
